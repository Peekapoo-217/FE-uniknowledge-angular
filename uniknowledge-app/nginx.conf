# FE/uniknowledge-app/nginx.conf

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Match all routes and fallback to index.html for Angular SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Proxy API requests to backend service if needed in the future
    # location /api {
    #     proxy_pass http://backend:8080/api;
    # }

    # Caching instructions for static assets
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
