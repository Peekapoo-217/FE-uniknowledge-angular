<div class="not-found-wrapper">
  <div class="glass-container animate-fade-in">
    <div class="error-visual">
      <h1 class="glitch-text" data-text="404">404</h1>
      <div class="decorative-blob"></div>
    </div>

    <div class="content-section">
      <h2 class="title">Úi! Trang này không tồn tại</h2>
      <p class="description">
        Có vẻ như bạn đã đi lạc vào một vùng kiến thức chưa được khám phá. 
        Đừng lo, chúng tôi sẽ giúp bạn quay lại đúng hướng!
      </p>

      <div class="primary-actions">
        <a mat-flat-button color="primary" routerLink="/" class="home-btn">
          <mat-icon>home</mat-icon>
          Về trang chủ
        </a>
        
        @if (!authService.isAuthenticated()) {
          <a mat-stroked-button routerLink="/login" class="login-btn">
            Đăng nhập
          </a>
        }
      </div>

      <div class="divider">
        <span>Hoặc khám phá</span>
      </div>

      <div class="quick-links">
        <a mat-button routerLink="/tags" class="link-item">
          <mat-icon>local_offer</mat-icon>
          Tags phổ biến
        </a>
        <a mat-button routerLink="/categories" class="link-item">
          <mat-icon>category</mat-icon>
          Danh mục
        </a>
      </div>
    </div>
  </div>
</div>
