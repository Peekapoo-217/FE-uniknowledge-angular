<div class="bg-gray-50 min-h-screen py-8">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-gray-900">Search Results</h1>
      <p class="mt-2 text-gray-600" *ngIf="searchTerm">
        Showing results for: <span class="font-semibold">"{{ searchTerm }}"</span>
      </p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      <!-- Filters Sidebar -->
      <div class="lg:col-span-3">
        <div class="bg-white rounded-lg shadow p-6 sticky top-24">
          <h2 class="text-lg font-semibold text-gray-900 mb-4">Filters</h2>
          
          <!-- Tag Filter -->
          <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">Tag</label>
            <input type="text" [(ngModel)]="selectedTag" (keyup.enter)="onFilterChange()"
              placeholder="Filter by tag..."
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm" />
          </div>

          <!-- Status Filter -->
          <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">Status</label>
            <select [(ngModel)]="isSolved" (change)="onFilterChange()"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm">
              <option [ngValue]="null">All Questions</option>
              <option [ngValue]="true">Solved</option>
              <option [ngValue]="false">Unsolved</option>
            </select>
          </div>

          <button (click)="clearFilters()"
            class="w-full py-2 px-4 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500">
            Clear All
          </button>
        </div>
      </div>

      <!-- Results Content -->
      <div class="lg:col-span-9">
        <!-- Search Bar in Results -->
        <div class="bg-white rounded-lg shadow p-4 mb-6">
          <div class="flex gap-4">
            <div class="relative flex-1">
              <input type="text" [(ngModel)]="searchTerm" (keyup.enter)="onFilterChange()"
                placeholder="Search UniKnowledge..."
                class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500" />
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
              </div>
            </div>
            <button (click)="onFilterChange()"
              class="px-6 py-2 bg-primary-600 text-white rounded-md hover:bg-primary-700">
              Search
            </button>
          </div>
        </div>

        <!-- Loading State -->
        <div *ngIf="isLoading()" class="bg-white rounded-lg shadow p-12 text-center">
          <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-primary-500 border-t-transparent"></div>
          <p class="mt-4 text-gray-600 font-medium">Searching for the best answers...</p>
        </div>

        <!-- Results List -->
        <div *ngIf="!isLoading()">
          <div *ngIf="questions().length === 0" class="bg-white rounded-lg shadow p-12 text-center">
            <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 9.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <h3 class="mt-4 text-lg font-medium text-gray-900">No results found</h3>
            <p class="mt-2 text-gray-500">Try adjusting your filters or search keywords.</p>
          </div>

          <app-question-list *ngIf="questions().length > 0" [questions]="questions()">
          </app-question-list>
        </div>
      </div>
    </div>
  </div>
</div>
