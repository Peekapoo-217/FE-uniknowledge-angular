<div class="flex-1 min-w-0 flex flex-col">
  <!-- Title -->
  <h2 class="text-[18px] font-normal text-[#0074cc] hover:text-[#0a95ff] mb-1.5 leading-snug transition-colors">
    <a [routerLink]="['/questions', question().questionId]">
      {{ question().title }}
    </a>
  </h2>

  <!-- Content Preview -->
  <div class="text-[#3b4045] mb-4 line-clamp-2 text-[14px] leading-relaxed font-light">
    {{ question().content }}
  </div>

  <!-- Footer Area: Tags & Meta -->
  <div class="flex items-start mt-auto pt-2">
    <!-- Tags -->
    <div class="flex flex-wrap gap-1.5 pt-1">
      @for (tag of question().tags; track tag.tagId) {
        <span
          class="tag-pill transition-all active:scale-95 cursor-pointer"
          (click)="onTagClick(tag.tagId)">
          {{ tag.tagName }}
        </span>
      }
    </div>

    <!-- Owner Card (Bottom Right - Fixed Alignment) -->
    <div class="flex flex-col items-end shrink-0 ml-auto">
      <div class="flex items-center gap-2 px-1 py-1">
        <div class="w-9 h-9 rounded bg-gradient-to-br from-indigo-100 to-indigo-200 flex items-center justify-center text-indigo-700 text-sm font-semibold shadow-sm">
            {{ question().user.username.substring(0, 1).toUpperCase() }}
        </div>
        <div class="flex flex-col">
            <span class="text-[13px] font-normal text-[#0074cc] hover:text-[#0a95ff] cursor-pointer transition-colors leading-none mb-1">
                {{ question().user.username }}
            </span>
            <span class="text-[12px] text-slate-400 font-light leading-none">
                asked {{ question().createdAt | timeAgo }}
            </span>
        </div>
      </div>
    </div>
  </div>
</div>
