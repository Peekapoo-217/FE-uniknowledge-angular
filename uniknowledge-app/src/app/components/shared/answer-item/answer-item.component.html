<div class="border-b border-gray-200 pb-6 last:border-b-0 last:pb-0">
    <div class="flex gap-6">
        <!-- Voting -->
        <app-voting [voteCount]="answer().voteCount" [showButtons]="showVoteButtons()" size="small"
            (upvote)="onUpvote()" (downvote)="onDownvote()">
        </app-voting>

        <!-- Answer Content -->
        <div class="flex-1">
            <div class="prose max-w-none mb-4">
                <p class="text-gray-700 whitespace-pre-wrap">{{ answer().content }}</p>
                @if (answer().codeLanguage) {
                <app-code-editor 
                    [value]="answer().codeContent || ''" 
                    [language]="answer().codeLanguage!"
                    [readOnly]="true"
                    [codeId]="answer().answerId"
                    [targetType]="'answer'"
                    [lineCount]="answer().codeLineCount">
                </app-code-editor>
                }
            </div>

            <div class="flex items-center gap-4 text-sm text-gray-600">
                <div class="flex items-center gap-2">
                    <span>answered by <span class="font-medium text-primary-600">{{ answer().username }}</span></span>
                    <span>•</span>
                    <span>{{ answer().createdAt | timeAgo }}</span>
                </div>

                @if (isAuthenticated() && !isReply()) {
                <button (click)="toggleReplyForm()" 
                        class="text-primary-600 hover:text-primary-700 font-medium flex items-center gap-1 transition-colors">
                    <i class="fas fa-reply"></i>
                    Reply
                </button>
                }
            </div>

            <!-- Reply Form -->
            @if (isReplyFormVisible()) {
            <div class="mt-4 animate-fadeIn">
                <app-answer-form (submitAnswer)="onReplySubmit($event)"></app-answer-form>
            </div>
            }

            <!-- Nested Replies (1 level only) -->
            @if (replies().length > 0) {
            <div class="mt-6 pl-8 border-l-2 border-gray-100 space-y-6">
                @for (reply of replies(); track reply.answerId) {
                <app-answer-item 
                    [answer]="reply" 
                    [isReply]="true"
                    [showVoteButtons]="showVoteButtons()"
                    (upvote)="upvote.emit($event)"
                    (downvote)="downvote.emit($event)">
                </app-answer-item>
                }
            </div>
            }
        </div>
    </div>
</div>
