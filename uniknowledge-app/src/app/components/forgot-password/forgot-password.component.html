<div class="min-h-screen flex flex-col items-center justify-center bg-slate-100/50 py-12 px-4 sm:px-6 lg:px-8 font-sans">
  <!-- Brand / Logo Area -->
  <div class="mb-10 text-center animate-in">
    <div class="inline-flex items-center justify-center w-20 h-20 bg-white rounded-3xl shadow-md border border-slate-200 mb-5">
      <svg class="w-12 h-12 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
      </svg>
    </div>
    <h2 class="text-3xl font-medium text-slate-900">Forgot Password</h2>
    <p class="mt-2 text-slate-600 font-normal">Enter your email to receive OTP code</p>
  </div>

  <div class="max-w-md w-full animate-in" style="animation-delay: 0.15s;">
    <div class="bg-white rounded-2xl shadow-2xl shadow-slate-300/60 p-10 border border-slate-200">
      
      @if (message()) {
        <div class="rounded-xl p-4 mb-6 animate-in" 
             [class.bg-emerald-50]="isSuccess()" [class.border]="true" 
             [class.border-emerald-200]="isSuccess()" [class.bg-red-50]="!isSuccess()" 
             [class.border-red-200]="!isSuccess()">
          <div class="flex items-center gap-3">
             @if (isSuccess()) {
               <svg class="h-5 w-5 text-emerald-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
             } @else {
               <svg class="h-5 w-5 text-red-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg>
             }
             <p class="text-sm font-medium" [class.text-emerald-900]="isSuccess()" [class.text-red-900]="!isSuccess()">
                {{ message() }}
             </p>
          </div>
        </div>
      }
      
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label for="email" class="block text-sm font-semibold text-slate-800 mb-2">Email</label>
          <input 
            id="email"
            type="email" 
            formControlName="email" 
            class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-4 focus:ring-indigo-500/15 focus:border-indigo-600 transition-all font-normal placeholder:text-slate-400"
            placeholder="your.email@example.com"
          />
          @if (form.get('email')?.invalid && form.get('email')?.touched) {
            <p class="mt-2 text-sm text-red-600 font-normal italic">Please enter a valid email address</p>
          }
        </div>
        
        <button 
          type="submit" 
          [disabled]="isLoading()"
          class="w-full flex justify-center py-3.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold rounded-xl shadow-lg shadow-indigo-200 transition-all focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed transform active:scale-[0.97]"
        >
          @if (isLoading()) {
            <span class="flex items-center gap-2">
              <svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Sending...
            </span>
          } @else {
            <span>Send OTP Code</span>
          }
        </button>
        
        <div class="text-center pt-2">
          <a routerLink="/login" class="text-sm font-bold text-indigo-600 hover:text-indigo-700 transition-colors flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            Back to Login
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
