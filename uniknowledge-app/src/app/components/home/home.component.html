<div class="bg-gray-50 min-h-screen">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      <!-- Main Content -->
      <div class="lg:col-span-9">
        <!-- Loading State -->
        @if (isLoading()) {
        <div class="bg-white rounded-lg shadow p-8 text-center">
          <p class="mt-2 text-gray-600">Loading questions...</p>
        </div>
        }

        <!-- Questions List -->
        @if (!isLoading()) {
        @if (questions().length === 0) {
        <div class="bg-white rounded-lg shadow p-8 text-center">
          <p class="text-gray-600">No questions found. Be the first to ask!</p>
        </div>
        } @else {
        <app-question-list [questions]="questions()" (tagClick)="onTagClick($event)">
        </app-question-list>

        <!-- Infinite Scroll Loading Indicator -->
        @if (isLoadingMore()) {
        <div class="mt-6 flex justify-center">
          <div class="flex items-center gap-3 text-gray-500">
            <svg class="animate-spin h-5 w-5 text-primary-600" xmlns="http://www.w3.org/2000/svg" fill="none"
              viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
              </path>
            </svg>
            <span class="text-sm">Loading more questions...</span>
          </div>
        </div>
        }
        }
        }
      </div>

      <!-- Sidebar -->
      <div class="mt-8 lg:mt-0 lg:col-span-3">
        <app-home-sidebar [popularTags]="popularTags()" [categories]="categories()" (tagClick)="onTagClick($event)"
          (categoryClick)="onCategoryChange($event)">
        </app-home-sidebar>
      </div>
    </div>
  </div>
</div>
